<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Рецепты — Кухни мира</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
<div class="brand">🍲 Кухни мира <span>Админ-панель</span></div>
<nav class="main-nav">
<a href="recipes.html" class="active">Рецепты</a>
<a href="categories.html">Категории</a>
<a href="ingredients.html">Ингредиенты</a>
<a href="steps.html">Шаги</a>
<a href="orders.html">Заказы</a>
</nav>
<div class="user-box">
<span>admin@champ2026</span>
<a href="login.html" class="btn-logout">Выйти</a>
</div>
</header>

<main class="container">
<h1>Рецепты</h1>
<a href="recipe-form.html" class="btn btn-primary" style="margin-bottom:18px;display:inline-block;">
+ Добавить рецепт
</a>

<!-- Фильтры -->
<form class="filters" method="get" action="recipes.html">
<select name="difficulty" aria-label="Сложность">
<option value="">Сложность</option>
<option value="легко">легко</option>
<option value="средне">средне</option>
<option value="сложно">сложно</option>
</select>

<select name="time" aria-label="Время">
<option value="">Время приготовления</option>
<option value="to15">до 15 минут</option>
<option value="60_120">60–120 минут</option>
<option value="over120">свыше 120 минут</option>
</select>

<select name="category_id" aria-label="Категория">
<option value="">Все категории</option>
<option value="1">Первые блюда</option>
<option value="2">Салаты</option>
<option value="3">Десерты</option>
</select>

<select name="price" aria-label="Стоимость">
<option value="">Стоимость</option>
<option value="free">Бесплатные</option>
<option value="paid">Платные</option>
</select>

<select name="sort" aria-label="Сортировка">
<option value="newest_desc" selected>Новизна 🔽</option>
<option value="newest_asc">Новизна 🔼</option>
<option value="time_asc">Время 🔼</option>
<option value="time_desc">Время 🔽</option>
</select>

<button type="submit" class="btn btn-secondary">Применить</button>
</form>

<table class="data">
<thead>
<tr>
<th>Фото</th>
<th>Название</th>
<th>Время</th>
<th>Стоимость</th>
<th>Сложность</th>
<th>Действия</th>
</tr>
</thead>
<tbody>
<tr>
<td><img class="thumb" src="img/placeholder.jpg" alt=""></td>
<td>Борщ</td>
<td>2 часа</td>
<td>—</td>
<td><span class="badge badge-warning">средне</span></td>
<td>
<a href="recipe-form.html" class="btn btn-secondary btn-sm">Изм.</a>
<button class="btn btn-danger btn-sm" type="button">Удалить</button>
</td>
</tr>
<tr>
<td><img class="thumb" src="img/placeholder.jpg" alt=""></td>
<td>Оливье</td>
<td>1 час 20 минут</td>
<td>500.00</td>
<td><span class="badge badge-success">легко</span></td>
<td>
<a href="recipe-form.html" class="btn btn-secondary btn-sm">Изм.</a>
<button class="btn btn-danger btn-sm" type="button">Удалить</button>
</td>
</tr>
<!-- Помеченный на удаление -->
<tr class="trashed">
<td><img class="thumb" src="img/placeholder.jpg" alt=""></td>
<td>Пицца <span class="badge badge-danger">Удалён</span></td>
<td>25 минут</td>
<td>—</td>
<td><span class="badge badge-success">легко</span></td>
<td>
<button class="btn btn-success btn-sm" type="button">Восстановить</button>
<button class="btn btn-danger btn-sm" type="button">Удалить навсегда</button>
</td>
</tr>
</tbody>
</table>

<nav class="pagination">
<span class="disabled">‹</span>
<span class="current">1</span>
<a href="?page=2">2</a>
<a href="?page=3">3</a>
<a href="?page=2">›</a>
</nav>
</main>
</body>
</html>
