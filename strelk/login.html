<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход — Кухни мира</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
<div>
<div class="login-brand">🍲 Кухни мира</div>
<div class="login-card">
<h1>Вход в админ-панель</h1>
<form action="recipes.html" method="get" novalidate>
<div class="form-row">
<label for="email">Email <span class="req">*</span></label>
<input type="email" id="email" name="email" required
placeholder="admin@champ2026" autocomplete="username">
<div class="error-text">Введите корректный email</div>
</div>
<div class="form-row">
<label for="password">Пароль <span class="req">*</span></label>
<input type="password" id="password" name="password" required
minlength="6" autocomplete="current-password">
<div class="error-text">Введите пароль (не менее 6 символов)</div>
</div>
<div class="alert alert-danger" id="loginError" hidden>
Неверный email или пароль
</div>
<button type="submit" class="btn btn-primary">Войти</button>
</form>
</div>
</div>
</div>
</body>
</html>
