<main class="container">
<h1>Ингредиенты</h1>

<form class="card" method="post" novalidate>
<h2>Добавить ингредиент</h2>
<div class="form-row">
<label for="ingTitle">Название ингредиента <span class="req">*</span></label>
<input type="text" id="ingTitle" name="title" required maxlength="20"
placeholder="До 20 символов, уникальное">
<div class="error-text">Обязательно, уникальное, до 20 символов</div>
</div>
<div class="form-row">
<label for="ingUnit">Единица измерения <span class="req">*</span></label>
<select id="ingUnit" name="unit" required>
<option value="">— выберите —</option>
<option value="шт">шт</option>
<option value="л">л</option>
<option value="кг">кг</option>
<option value="мг">мг</option>
<option value="ст.л.">ст.л.</option>
</select>
<div class="error-text">Выберите единицу измерения</div>
</div>
<button type="submit" class="btn btn-primary">Добавить</button>
</form>

<table class="data" style="margin-top:20px;">
<thead>
<tr><th>ID</th><th>Название</th><th>Ед. изм.</th><th>Действия</th></tr>
</thead>
<tbody>
<tr>
<td>1</td><td>Свекла</td><td>шт</td>
<td>
<button class="btn btn-secondary btn-sm" type="button">Изм.</button>
<button class="btn btn-danger btn-sm" type="button">Удалить</button>
</td>
</tr>
<tr>
<td>2</td><td>Капуста</td><td>кг</td>
<td>
<button class="btn btn-secondary btn-sm" type="button">Изм.</button>
<button class="btn btn-danger btn-sm" type="button">Удалить</button>
</td>
</tr>
</tbody>
</table>
</main>
</body>
</html>
